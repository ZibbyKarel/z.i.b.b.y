<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>off-page region</title>
    <style>
      body {
        margin: 0;
        background: #101418;
      }
      /*
       * `ZIBBY Redesign Canvas.html` in miniature: a pan/zoom viewport whose
       * content is transformed far outside it and clipped, so the document never
       * grows to contain it. The child is a real, visible, styled element — it is
       * simply not on the full-page screenshot, which is what makes a `clip`
       * against that screenshot impossible.
       */
      .viewport {
        position: relative;
        width: 1000px;
        height: 200px;
        overflow: hidden;
      }
      .off-page {
        position: absolute;
        top: 0;
        left: 0;
        width: 300px;
        height: 120px;
        background: #ff00ff;
        transform: translate(0, 2000px);
      }
      .on-page {
        width: 300px;
        height: 120px;
        background: #00ff00;
      }
    </style>
  </head>
  <body>
    <!--
      The text is inline rather than in a child element on purpose: it is below
      MIN_SIDE so it adds no candidate, the ranking is unchanged, and `.off-page`
      becomes a region the emptiness guard accepts. That makes this fixture prove
      the other half of task 19's D9 decision — a region off the page image is
      still capturable, so `cropFitsPage` is not the capturability predicate.
    -->
    <div class="viewport"><div class="off-page">karta</div></div>
    <div class="on-page"></div>
  </body>
</html>
