name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so PR pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # No --fix in CI: the `lint` npm script mutates files, we only want to fail on violations.
      - run: pnpm exec eslint .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run check:types

  cycles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Fail the build on any circular import inside apps/web (madge). The app's
      # feature graph is currently acyclic; this keeps it that way.
      - run: pnpm run check:cycles

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # vitest run — all 5 workspace projects (design-system, contracts, api, web, web-components).
      - run: pnpm run test
      # design-match's browser-driven tests live outside vitest.workspace.ts (Step 0 of
      # task 4) so the fast suite above stays browser-free; Chromium isn't installed yet.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser-driven design-match tests
        run: pnpm run test:browser

  self-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Fails if the committed self-knowledge fixture note has drifted from the
      # committed `apps/api/data-test` catalog (agents/pipelines/gate-rules) — the
      # same check the `.githooks/pre-commit` hook runs locally, pinned at the
      # repo's committed fixture data root (there is no committed live data dir).
      - run: pnpm check:self-knowledge
        env:
          ZIBBY_DATA_DIR: apps/api/data-test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # next build (also runs lint + type-checking by default; the api is ts-node runtime, no build step).
      - run: pnpm run web:build
