name: Desktop release

# Builds ZibbyOS.app on a macOS runner and publishes it as a GitHub Release, which
# the installed app's updater polls. Triggered only by a `desktop-v*` tag (cut with
# `pnpm release:patch|minor|major`) — a plain push to main never builds the app.
# A manual run (workflow_dispatch) builds the current main into a DRAFT release, to
# test the pipeline: drafts are invisible to the updater.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15 # arm64 — the only arch the app ships for
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "desktop-v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ZibbyOS.app
        run: pnpm desktop:dist
        env:
          # Baked into build-info.json; the app expands `~` at runtime.
          ZIBBY_BUILD_SOURCE_ROOT: ~/Workspace/z.i.b.b.y
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Checksum
        working-directory: apps/desktop/release
        run: |
          ZIP="ZibbyOS-${{ steps.version.outputs.version }}-arm64.zip"
          test -f "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          cat "$ZIP.sha256"

      - name: Refuse to ship secrets
        run: |
          APP="apps/desktop/release/mac-arm64/ZibbyOS.app/Contents/Resources"
          FOUND=$(find "$APP" -name '.env*' -not -path '*/node_modules/*' -not -name '.env.example' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Bundle contains env files:"; echo "$FOUND"; exit 1
          fi

      - name: Publish release
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          FILES=("ZibbyOS-$V-arm64.zip" "ZibbyOS-$V-arm64.zip.sha256" "ZibbyOS-$V-arm64.dmg")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$TAG" "${FILES[@]}" --title "ZibbyOS $V" --generate-notes --verify-tag
          else
            gh release create "$TAG" "${FILES[@]}" --title "ZibbyOS $V (test build)" --draft \
              --target "$GITHUB_SHA" --notes "Manual test build of $GITHUB_SHA. Not visible to the updater."
          fi
