name: E2E

# Playwright is the only browser-driven layer and is deliberately separate from the
# fast CI checks: it cold-starts both dev servers (reuseExistingServer: !CI — GitHub
# Actions sets CI=true on every runner, so servers always boot fresh), runs serially
# (workers: 1), and carries the usual browser-flake surface. Keep it OUT of required
# branch-protection checks until it has a green CI track record, then promote it.
#
# Phase 15 (2026-06-14): the ubuntu `playwright` job is ENABLED on pull_request +
# workflow_dispatch (not push — the self-hosted macOS job below covers push to main,
# so there's no double-run). Phase 14.3 removed the two original blockers: the suite is
# now token-free (playwright.config.ts apiEnv points CLAUDE_BIN at the committed
# fake-claude.mjs stub — no real `claude` on the runner), and the cold-start path is
# deterministic (global-setup drains + presence-gates the approvals queue). The cold
# `CI=true pnpm e2e` path was proven green 3/3 locally before flipping the gate. Guard:
# apps/api/test/e2e-workflow.test.ts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    # Runs on pull_request + workflow_dispatch (NOT push — the self-hosted macOS job
    # covers push to main). Token-free + cold-start-deterministic since Phase 14.3.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # On a cache hit only the OS-level deps need installing; otherwise pull browsers too.
      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run e2e
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Phase 8.3: the operator's own macOS machine runs the suite on push to main only.
  # NEVER on pull_request — self-hosted + untrusted fork PRs is the classic foot-gun,
  # and guarding a single-operator repo costs nothing. CI=1 turns off
  # reuseExistingServer so the config boots fresh, isolated servers. The suite is
  # token-free (demo knobs in playwright.config.ts apiEnv); prove it locally with
  # CLAUDE_BIN unset before relying on it. Runner registration: docs/ops.md.
  playwright-selfhosted:
    if: ${{ github.event_name == 'push' }}
    runs-on: [self-hosted, macOS, zibby]
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - name: Run e2e
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-selfhosted
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
