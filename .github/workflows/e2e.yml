name: E2E

# Playwright is the only browser-driven layer and is deliberately separate from the
# fast CI checks: it cold-starts both dev servers (reuseExistingServer: !CI), runs
# serially (workers: 1), and carries the usual browser-flake surface. Keep it OUT of
# required branch-protection checks until it's proven stable, then promote it.
#
# DISABLED IN CI: the suite is not yet stable in GitHub Actions (the approval
# throughline needs the `claude` binary, which isn't installed on the runner, and
# the cold-start dev-server path is flaky). The job is gated to manual runs only so
# push/PR show it as *skipped*, not failed. The specs still run locally via
# `pnpm exec playwright test`. To re-enable automatic runs, drop the job-level `if:`
# below (and trim this note).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    # Skipped on push/PR (see DISABLED note above); runs only on manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # On a cache hit only the OS-level deps need installing; otherwise pull browsers too.
      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run e2e
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
