<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZIBBY — Archiv úloh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0e13; }
  #root { height: 100vh; }
  ::selection { background: rgba(91,141,239,0.35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 0; }
  ::-webkit-scrollbar-track { background: transparent; }
  a { color: #5b8def; }
  a:hover { color: #7aa5f8; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="zibby/data.jsx"></script>
<script type="text/babel" src="zibby/data-extra.jsx"></script>
<script type="text/babel" src="zibby/icons.jsx"></script>
<script type="text/babel" src="zibby/zt.jsx"></script>
<script type="text/babel" src="zibby/velin-c-data.jsx"></script>
<script type="text/babel" src="zibby/velin-c-tasks.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

// ── syntetická data pro objem archivu (demo) ──────────────────────────────
const AR_EXTRA = [
  { id: 'x1', sys: 'forge', title: 'fix/session-refresh', kind: 'Build Feature', proj: 'auth-svc', group: 'today', dur: '18 min', cost: 0.41 },
  { id: 'x2', sys: 'loom', title: 'Architektonický audit · billing', kind: 'Codebase watch', proj: 'billing-svc', group: 'today', dur: '34 min', cost: 0.22 },
  { id: 'x3', sys: 'scout', title: 'Konkurenční analýza — ceny', kind: 'Nightly Research', proj: 'zibby-core', group: 'yesterday', dur: '1 h 5 min', cost: 0.9 },
  { id: 'x4', sys: 'herald', title: 'Odpověď — dotaz na SLA', kind: 'Outbound reply', proj: 'support', group: 'yesterday', dur: '3 min', cost: 0.04 },
  { id: 'x5', sys: 'sentinel', title: 'Sken tajemství · billing-svc', kind: 'Dependency scan', proj: 'billing-svc', group: 'yesterday', dur: '7 min', cost: 0.08 },
  { id: 'x6', sys: 'forge', title: 'feat/csv-export', kind: 'Build Feature', proj: 'auth-svc', group: 'week', dur: '52 min', cost: 1.12 },
  { id: 'x7', sys: 'maestro', title: 'Release r2026.4', kind: 'Release Train', proj: 'auth-svc', group: 'week', dur: '2 h 4 min', cost: 0.31 },
  { id: 'x8', sys: 'puls', title: 'Souhrn incidentů — týdenní', kind: 'Heartbeat', proj: 'home-ops', group: 'week', dur: '2 min', cost: 0.02 },
  { id: 'x9', sys: 'beacon', title: 'Eskalace · zpožděná faktura', kind: 'Escalation', proj: 'home-ops', group: 'older', dur: '1 min', cost: 0.01 },
  { id: 'x10', sys: 'scout', title: 'Dodavatelé cloud hostingu', kind: 'Nightly Research', proj: 'zibby-core', group: 'older', dur: '48 min', cost: 0.7 },
  { id: 'x11', sys: 'loom', title: 'Refaktoring — modul store', kind: 'Codebase watch', proj: 'auth-svc', group: 'older', dur: '41 min', cost: 0.19 },
];
const AR_GROUP_LABEL = { today: 'Dnes', yesterday: 'Včera', week: 'Tento týden', older: 'Starší' };
const AR_GROUP_ORDER = ['today', 'yesterday', 'week', 'older'];

// úlohy z archivu, které mají plný detail (fáze, vstup, výstup) — z VC_TASKS_DONE
const AR_DETAILED = VC_TASKS_DONE.reduce((m, t) => { m[t.id] = t; return m; }, {});
const arAll = () => {
  const done = VC_TASKS_DONE.map((t) => ({ id: t.id, sys: t.sys, title: t.title, kind: t.kind, proj: t.proj, group: 'yesterday', dur: t.finishedAt, cost: t.phases.reduce((a, p) => a + (p.cost || 0), 0), full: t }));
  return [...AR_EXTRA, ...done];
};
const arFilter = (items, q, sysFilter) => items.filter((it) => {
  if (sysFilter && sysFilter.length > 0 && !sysFilter.includes(it.sys)) return false;
  if (!q) return true;
  const s = q.toLowerCase();
  return it.title.toLowerCase().includes(s) || it.kind.toLowerCase().includes(s) || it.proj.toLowerCase().includes(s);
});
const arGroup = (items) => {
  const by = {};
  items.forEach((it) => { (by[it.group] = by[it.group] || []).push(it); });
  return AR_GROUP_ORDER.filter((g) => by[g] && by[g].length).map((g) => ({ id: g, label: AR_GROUP_LABEL[g], items: by[g] }));
};

const ArRow = ({ it, active, onClick }) => {
  const sys = vcSys(it.sys);
  const [h, setH] = useState(false);
  return (
    <div onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={{
      display: 'flex', alignItems: 'center', gap: 12, padding: '11px 14px', borderRadius: ZT.rCtl, cursor: 'pointer',
      background: active ? `${sys.hue}14` : h ? 'rgba(255,255,255,0.045)' : 'transparent',
      border: `1px solid ${active ? sys.hue + '55' : 'transparent'}`, transition: 'background .12s, border-color .12s',
    }}>
      <span style={{ width: 7, height: 7, borderRadius: '50%', background: sys.hue, flex: '0 0 auto', boxShadow: `0 0 6px ${sys.hue}88` }} />
      <div style={{ minWidth: 0, flex: 1 }}>
        <div style={{ fontFamily: ZT.sans, fontSize: 13, fontWeight: 500, color: ZT.ink, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{it.title}</div>
        <div style={{ fontFamily: ZT.mono, fontSize: 10.5, color: ZT.ink3, marginTop: 2 }}>{sys.name} · {it.proj}</div>
      </div>
      <Icon name="ok" size={12} style={{ color: ZT.ok, flex: '0 0 auto' }} />
      <span style={{ fontFamily: ZT.mono, fontSize: 10, color: ZT.ink3, flex: '0 0 auto' }}>{it.dur}</span>
    </div>
  );
};

// ── vyhledávání v topbaru — pill uprostřed, po focusu se roztáhne a otevře plachtu s výsledky ──
const ArTopSearch = ({ q, setQ, groups, total, selId, onPick }) => {
  const [open, setOpen] = useState(false);
  const [focused, setFocused] = useState(false);
  const wrapRef = React.useRef(null);
  const inputRef = React.useRef(null);
  const expanded = open || focused;

  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') { setOpen(false); inputRef.current && inputRef.current.blur(); } };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDoc); document.removeEventListener('keydown', onKey); };
  }, [open]);

  const showSheet = open && (q.length > 0 || groups.length > 0);

  return (
    <>
      {showSheet && (
        <div onClick={() => setOpen(false)} style={{
          position: 'fixed', inset: 0, zIndex: 24, background: 'rgba(6,8,11,0.55)', backdropFilter: 'blur(2px)',
          opacity: showSheet ? 1 : 0, transition: 'opacity .2s ease',
        }} />
      )}
      <div ref={wrapRef} style={{ position: 'relative', zIndex: 25, width: expanded ? 560 : 380, maxWidth: '100%', transition: 'width .32s cubic-bezier(.16,1,.3,1)' }}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 9, padding: '0 14px', height: 38, borderRadius: 999,
          background: ZT.surface, border: `1px solid ${expanded ? ZT.accent + '77' : ZT.line}`,
          boxShadow: expanded ? `0 0 0 4px ${ZT.accent}17, 0 22px 46px rgba(0,0,0,0.4)` : 'none',
          transition: 'border-color .22s ease, box-shadow .22s ease',
        }}>
          <Icon name="search" size={13} style={{ color: expanded ? ZT.accent : ZT.ink3, flex: '0 0 auto' }} />
          <input ref={inputRef} value={q} onFocus={() => { setFocused(true); setOpen(true); }} onBlur={() => setFocused(false)}
            onChange={(e) => { setQ(e.target.value); setOpen(true); }} placeholder="Hledat v archivu…"
            style={{ flex: 1, minWidth: 0, background: 'none', border: 'none', outline: 'none', fontFamily: ZT.sans, fontSize: 12.5, color: ZT.ink }} />
          {q.length > 0 && (
            <button onClick={() => { setQ(''); inputRef.current && inputRef.current.focus(); }} style={{
              display: 'grid', placeItems: 'center', width: 18, height: 18, borderRadius: '50%', flex: '0 0 auto',
              background: 'rgba(255,255,255,0.08)', border: 'none', cursor: 'pointer', color: ZT.ink3,
            }}><Icon name="x" size={10} /></button>
          )}
          {!expanded && <span style={{ ...T.micro, fontSize: 10, flex: '0 0 auto' }}>{total}</span>}
        </div>
        <div style={{
          position: 'absolute', left: 0, right: 0, top: 'calc(100% + 10px)', transformOrigin: 'top center',
          opacity: showSheet ? 1 : 0, transform: showSheet ? 'translateY(0) scale(1)' : 'translateY(-8px) scale(.97)',
          pointerEvents: showSheet ? 'auto' : 'none', transition: 'opacity .2s ease, transform .24s cubic-bezier(.16,1,.3,1)',
        }}>
          <div style={{
            borderRadius: ZT.rPanel, background: ZT.surfaceHi, border: `1px solid ${ZT.lineHi}`,
            boxShadow: '0 30px 70px rgba(0,0,0,0.55)', maxHeight: 460, overflow: 'auto', padding: '10px 8px',
          }}>
            {groups.length === 0 && <div style={{ ...T.micro, padding: 18, textAlign: 'center' }}>Nic nenalezeno.</div>}
            {groups.map((g) => (
              <div key={g.id} style={{ marginBottom: 10 }}>
                <div style={{ ...T.label, padding: '4px 8px 6px' }}>{g.label} · {g.items.length}</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  {g.items.map((it) => <ArRow key={it.id} it={it} active={selId === it.id} onClick={() => { onPick(it.id); setOpen(false); setQ(''); inputRef.current && inputRef.current.blur(); }} />)}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </>
  );
};

const ArSysMultiSelect = ({ selected, setSelected, bySys, total }) => {
  const [open, setOpen] = useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);
  const toggle = (id) => setSelected((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id]);
  const label = selected.length === 0 ? 'Všechny subsystémy' : selected.length === 1 ? vcSys(selected[0]).name : `${selected.length} subsystémy`;
  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button onClick={() => setOpen((o) => !o)} style={{
        display: 'flex', alignItems: 'center', gap: 8, width: '100%', padding: '0 12px', height: 38, borderRadius: ZT.rCtl, cursor: 'pointer',
        background: ZT.surface, border: `1px solid ${open ? ZT.lineHi : ZT.line}`, color: selected.length ? ZT.ink : ZT.ink2,
      }}>
        <Icon name="grid" size={13} style={{ color: ZT.ink3, flex: '0 0 auto' }} />
        {selected.length > 0 && selected.length <= 3 && (
          <div style={{ display: 'flex', gap: 4, flex: '0 0 auto' }}>
            {selected.map((id) => <span key={id} style={{ width: 7, height: 7, borderRadius: '50%', background: vcSys(id).hue }} />)}
          </div>
        )}
        <span style={{ fontFamily: ZT.sans, fontSize: 12.5, flex: 1, textAlign: 'left', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{label}</span>
        <Icon name="chevron" size={12} style={{ color: ZT.ink3, transform: open ? 'rotate(90deg)' : 'none', transition: 'transform .15s', flex: '0 0 auto' }} />
      </button>
      {open && (
        <div style={{
          position: 'absolute', left: 0, right: 0, top: 'calc(100% + 6px)', zIndex: 20, borderRadius: ZT.rPanel, overflow: 'hidden',
          background: ZT.surfaceHi, border: `1px solid ${ZT.lineHi}`, boxShadow: '0 20px 50px rgba(0,0,0,0.5)',
        }}>
          <div onClick={() => setSelected([])} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px', cursor: 'pointer', borderBottom: `1px solid ${ZT.line}` }}
            onMouseEnter={(e) => e.currentTarget.style.background = 'rgba(255,255,255,0.05)'} onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}>
            <span style={{ width: 15, height: 15, borderRadius: 4, border: `1.5px solid ${selected.length === 0 ? ZT.accent : ZT.line}`, background: selected.length === 0 ? ZT.accent : 'transparent', display: 'grid', placeItems: 'center', flex: '0 0 auto' }}>
              {selected.length === 0 && <Icon name="check" size={9} stroke={3} style={{ color: ZT.bg }} />}
            </span>
            <span style={{ fontFamily: ZT.sans, fontSize: 12.5, color: ZT.ink, flex: 1 }}>Všechny subsystémy</span>
            <span style={{ fontFamily: ZT.mono, fontSize: 10.5, color: ZT.ink3 }}>{total}</span>
          </div>
          <div style={{ maxHeight: 260, overflow: 'auto' }}>
            {VC_SUBSYSTEMS.map((s) => {
              const on = selected.includes(s.id);
              return (
                <div key={s.id} onClick={() => toggle(s.id)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px', cursor: 'pointer' }}
                  onMouseEnter={(e) => e.currentTarget.style.background = 'rgba(255,255,255,0.05)'} onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}>
                  <span style={{ width: 15, height: 15, borderRadius: 4, border: `1.5px solid ${on ? s.hue : ZT.line}`, background: on ? s.hue : 'transparent', display: 'grid', placeItems: 'center', flex: '0 0 auto' }}>
                    {on && <Icon name="check" size={9} stroke={3} style={{ color: ZT.bg }} />}
                  </span>
                  <span style={{ width: 6, height: 6, borderRadius: '50%', background: s.hue, flex: '0 0 auto' }} />
                  <span style={{ fontFamily: ZT.sans, fontSize: 12.5, color: ZT.ink, flex: 1 }}>{s.name}</span>
                  <span style={{ fontFamily: ZT.mono, fontSize: 10.5, color: ZT.ink3 }}>{bySys[s.id] || 0}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
};

const ArSysPill = ({ sys, active, count, onClick }) => (
  <button onClick={onClick} style={{
    display: 'inline-flex', alignItems: 'center', gap: 6, padding: '5px 10px 5px 8px', borderRadius: 999, cursor: 'pointer',
    border: `1px solid ${active ? (sys ? sys.hue : ZT.accent) + '66' : ZT.line}`,
    background: active ? `${sys ? sys.hue : ZT.accent}1c` : 'transparent',
    color: active ? (sys ? sys.hue : ZT.accent) : ZT.ink2, fontFamily: ZT.mono, fontSize: 10.5, whiteSpace: 'nowrap',
  }}>
    {sys ? <><span style={{ width: 6, height: 6, borderRadius: '50%', background: sys.hue }} />{sys.name}</> : 'Vše'}
    <span style={{ opacity: 0.6 }}>{count}</span>
  </button>
);

// ── pravý panel — stejný obsah jako detail úlohy ve Velín-D (bez overlaye) ─
const arLastRunnable = (phases) => { for (let i = phases.length - 1; i >= 0; i--) if (phases[i].state !== 'idle') return i; return phases.length - 1; };

const ArDetailPane = ({ row }) => {
  const [selPhase, setSelPhase] = useState(null);
  const [overlay, setOverlay] = useState(null);
  const [phasesOpen, setPhasesOpen] = useState(true);

  if (!row) return (
    <div style={{ flex: 1, display: 'grid', placeItems: 'center', color: ZT.ink3 }}>
      <div style={{ textAlign: 'center' }}>
        <Icon name="archive" size={28} style={{ color: ZT.ink3, margin: '0 auto 12px' }} />
        <div style={{ ...T.bodySm }}>Vyber úlohu vlevo pro zobrazení detailu.</div>
      </div>
    </div>
  );

  const task = row.full;
  if (!task) return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 13, padding: '17px 24px', borderBottom: `1px solid ${ZT.line}` }}>
        <div style={{ width: 34, height: 34, borderRadius: ZT.rCtl, display: 'grid', placeItems: 'center', background: `${vcSys(row.sys).hue}22`, color: vcSys(row.sys).hue }}><Icon name={vcSys(row.sys).glyph} size={18} /></div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ ...T.micro, fontSize: 10 }}>{vcSys(row.sys).name} / {row.kind}</div>
          <div style={{ ...T.title, fontSize: 18, marginTop: 2 }}>{row.title}</div>
        </div>
        <ZtChip state="ok">hotovo</ZtChip>
      </div>
      <div style={{ flex: 1, display: 'grid', placeItems: 'center', color: ZT.ink3 }}>
        <div style={{ ...T.bodySm, textAlign: 'center', maxWidth: 340 }}>Tahle úloha zatím nemá uložený plný průběh (fáze, vstup, výstup) — jen souhrnný záznam v archivu.</div>
      </div>
    </div>
  );

  const sys = vcSys(task.sys);
  const activePhaseIdx = selPhase != null ? selPhase : arLastRunnable(task.phases);
  const activePhase = task.phases[activePhaseIdx];
  const doneCount = task.phases.filter((p) => p.state === 'ok').length;

  return (
    <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', position: 'relative' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 13, padding: '17px 24px', borderBottom: `1px solid ${ZT.line}`, background: `linear-gradient(180deg, ${sys.hue}12, transparent)` }}>
        <div style={{ width: 34, height: 34, borderRadius: ZT.rCtl, display: 'grid', placeItems: 'center', background: `${sys.hue}22`, border: `1px solid ${sys.hue}55`, color: sys.hue, flex: '0 0 auto' }}>
          <Icon name={sys.glyph} size={18} />
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ ...T.micro, fontSize: 10 }}>{sys.name} / {task.kind} · {task.proj}</div>
          <div style={{ ...T.title, fontSize: 18, marginTop: 2 }}>{task.title}</div>
        </div>
        <ZtChip state="ok">dokončeno · {task.finishedAt}</ZtChip>
      </div>
      <div style={{ position: 'relative', flex: 1, minHeight: 0, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 1, background: ZT.line, overflow: 'auto' }}>
        <div style={{ background: ZT.surface, padding: 20, display: 'flex', flexDirection: 'column', gap: 20 }}>
          <VcTaskInput input={task.input} onOpen={() => setOverlay('input')} />
          <div>
            <div onClick={() => setPhasesOpen((o) => !o)} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: phasesOpen ? 14 : 0, cursor: 'pointer', userSelect: 'none' }}>
              <span style={T.label}>Fáze úlohy</span>
              <span style={{ ...T.micro, fontSize: 10 }}>{doneCount}/{task.phases.length} hotovo</span>
              <Icon name="chevron" size={12} style={{ color: ZT.ink3, marginLeft: 'auto', transform: phasesOpen ? 'rotate(90deg)' : 'none', transition: 'transform .15s' }} />
            </div>
            {phasesOpen && <VcPhaseRail phases={task.phases} selected={activePhaseIdx} onSelect={setSelPhase} />}
          </div>
          {task.output.kind === 'pr' && <VcPrBlock pr={task.output.pr} accent={sys.hue} />}
          {task.output.kind === 'md' && <VcMdOutputBlock output={task.output} onOpen={() => setOverlay('output')} />}
        </div>
        <div style={{ background: ZT.surface, padding: 20, display: 'flex', flexDirection: 'column', gap: 20 }}>
          <div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 11 }}>
              <span style={T.label}>Log · {activePhase.name}</span>
            </div>
            <div style={{ background: ZT.bg, border: `1px solid ${ZT.line}`, borderRadius: ZT.rCtl, padding: '11px 13px', display: 'flex', flexDirection: 'column', gap: 7 }}>
              {activePhase.log.length > 0 ? activePhase.log.map((l, i) => (
                <div key={i} style={{ display: 'flex', gap: 9, fontFamily: ZT.mono, fontSize: 11.5, lineHeight: 1.4 }}>
                  <span style={{ color: ZT.ink3, flex: '0 0 auto' }}>{l.t}</span>
                  <span style={{ color: VC_LOG_C[l.lvl] || ZT.ink2 }}>{l.text}</span>
                </div>
              )) : <div style={{ ...T.micro, fontSize: 11, padding: '10px 12px', borderRadius: ZT.rCtl, background: ZT.bg, border: `1px dashed ${ZT.line}` }}>Tato fáze nemá záznam.</div>}
            </div>
          </div>
        </div>
        {overlay === 'input' && <VcExpandOverlay title="Vstup" icon="arrow" source={task.input.prompt} accent={sys.hue} onClose={() => setOverlay(null)} />}
        {overlay === 'output' && task.output.kind === 'md' && <VcExpandOverlay title={task.output.file} icon="doc" source={task.output.content} accent={sys.hue} onClose={() => setOverlay(null)} />}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '13px 24px', borderTop: `1px solid ${ZT.line}`, background: ZT.bg, flex: '0 0 auto' }}>
        <ZtBtn size="sm" variant="ghost" icon="doc">Otevřít soubory</ZtBtn>
        <span style={{ marginLeft: 'auto', ...T.micro, fontSize: 10.5 }}>dokončeno {task.finishedAt}</span>
      </div>
    </div>
  );
};

const App = () => {
  const [q, setQ] = useState('');
  const [sysF, setSysF] = useState([]);
  const [selId, setSelId] = useState(null);
  const items = useMemo(() => arFilter(arAll(), q, sysF), [q, sysF]);
  const groups = useMemo(() => arGroup(items), [items]);
  const bySys = useMemo(() => { const m = {}; arAll().forEach((it) => { m[it.sys] = (m[it.sys] || 0) + 1; }); return m; }, []);
  const selected = useMemo(() => arAll().find((it) => it.id === selId) || null, [selId]);

  return (
    <div style={{ width: '100%', height: '100%', background: ZT.bg, color: ZT.ink, fontFamily: ZT.sans, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <header style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', gap: 16, padding: '16px 24px', borderBottom: `1px solid ${ZT.line}`, flex: '0 0 auto', position: 'relative', zIndex: 26 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, minWidth: 0 }}>
          <a href="ZIBBY Velin-D.html" title="Zpět do Velín-D" style={{ width: 34, height: 34, borderRadius: ZT.rCtl, display: 'grid', placeItems: 'center', background: `${ZT.accent}18`, color: ZT.accent, textDecoration: 'none', flex: '0 0 auto' }}><Icon name="arrow" size={16} style={{ transform: 'rotate(180deg)' }} /></a>
          <div style={{ minWidth: 0 }}>
            <div style={T.title}>Archiv úloh</div>
            <div style={{ ...T.bodySm, fontSize: 12, marginTop: 2 }}>Vše, co ZIBBY dokončil napříč subsystémy</div>
          </div>
        </div>
        <ArTopSearch q={q} setQ={setQ} groups={groups} total={arAll().length} selId={selId} onPick={setSelId} />
        <div />
      </header>
      <div style={{ flex: 1, minHeight: 0, display: 'flex' }}>
        <div style={{ width: 340, flex: '0 0 auto', borderRight: `1px solid ${ZT.line}`, display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: 10, borderBottom: `1px solid ${ZT.line}` }}>
            <ArSysMultiSelect selected={sysF} setSelected={setSysF} bySys={bySys} total={arAll().length} />
          </div>
          <div style={{ flex: 1, minHeight: 0, overflow: 'auto', padding: '12px 10px 20px' }}>
            {groups.map((g) => (
              <div key={g.id} style={{ marginBottom: 16 }}>
                <div style={{ ...T.label, padding: '4px 6px 8px' }}>{g.label} · {g.items.length}</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  {g.items.map((it) => <ArRow key={it.id} it={it} active={selId === it.id} onClick={() => setSelId(it.id)} />)}
                </div>
              </div>
            ))}
            {groups.length === 0 && <div style={{ ...T.micro, padding: 20, textAlign: 'center' }}>Nic nenalezeno.</div>}
          </div>
        </div>
        <ArDetailPane row={selected} />
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
