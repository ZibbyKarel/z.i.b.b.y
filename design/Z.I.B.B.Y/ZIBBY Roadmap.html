<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZIBBY — Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#05070a;height:100%}
#root{height:100vh}
a{color:#5b8def}
a:hover{color:#7aa5f8}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="zibby/data.jsx"></script>
<script type="text/babel" src="zibby/icons.jsx"></script>
<script type="text/babel" src="zibby/shell.jsx"></script>
<script type="text/babel" src="zibby/frame.jsx"></script>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140"><rect width="200" height="140" fill="#0b0e13"/><rect x="30" y="30" width="50" height="80" rx="4" fill="#5b8def"/><rect x="90" y="30" width="50" height="50" rx="4" fill="#3fcf8e"/><rect x="150" y="30" width="20" height="30" rx="4" fill="#f0b429"/></svg></template>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const SYS = {
  herald:   { name: 'Herald',   hue: '#56c4d6', glyph: 'chat' },
  forge:    { name: 'Forge',    hue: '#5b8def', glyph: 'code' },
  maestro:  { name: 'Maestro',  hue: '#f0883e', glyph: 'checkpoint' },
  loom:     { name: 'Loom',     hue: '#b07cff', glyph: 'brain' },
  sentinel: { name: 'Sentinel', hue: '#7fd98a', glyph: 'shield' },
};

// epik = nápad rozpracovaný na tasky. Task.status: todo | in_progress | done
// blockedBy: [taskId] — task nelze pustit do práce, dokud dependence nejsou done
const EPICS = [
  { id: 'e1', title: 'Vícejazyčné odpovědi', sys: SYS.herald,
    desc: 'Herald odpovídá na support dotazy v jazyce, ve kterém přišly.',
    tasks: [
      { id: 't1', name: 'Návrh promptu',       agent: 'spec-skeleton', glyph: 'doc',    status: 'done', pr: 142 },
      { id: 't2', name: 'Detekce jazyka',      agent: 'ci-doctor',     glyph: 'shield', status: 'done', pr: 145 },
      { id: 't3', name: 'Lokalizace šablon',   agent: 'pr-prereview',  glyph: 'check',  status: 'in_progress', pr: 149 },
      { id: 't4', name: 'Rollout za flagem',   agent: 'changelog-gen', glyph: 'doc',    status: 'todo', blockedBy: ['t3'] },
    ] },
  { id: 'e2', title: 'Automatický changelog do Slacku', sys: SYS.maestro,
    desc: 'Po každém release sestaví a pošle shrnutí do #dev-general.',
    tasks: [
      { id: 't5', name: 'Sběr merge commitů', agent: 'changelog-gen', glyph: 'doc',   status: 'done', pr: 133 },
      { id: 't6', name: 'Formát zprávy',      agent: 'standup-gen',   glyph: 'spark', status: 'in_progress' },
      { id: 't7', name: 'Napojení na Slack',  agent: 'pr-prereview',  glyph: 'check', status: 'todo', blockedBy: ['t6'] },
      { id: 't8', name: 'Testovací kanál',    agent: 'ci-doctor',     glyph: 'shield',status: 'todo' },
    ] },
  { id: 'e3', title: 'Rate-limiting v2', sys: SYS.forge,
    desc: 'Sliding-window limiter místo pevných oken, per-klíč konfigurace.',
    tasks: [
      { id: 't9',  name: 'Spec & rozhraní', agent: 'spec-skeleton', glyph: 'doc',    status: 'done', pr: 151 },
      { id: 't10', name: 'Implementace',    agent: 'ci-doctor',     glyph: 'shield', status: 'todo', blocked: true, blockedNote: 'čeká na review specifikace' },
      { id: 't11', name: 'Zátěžové testy',  agent: 'pr-prereview',  glyph: 'check',  status: 'todo', blockedBy: ['t10'] },
    ] },
  { id: 'e4', title: 'Cyklické závislosti — auto-detekce', sys: SYS.loom, tasks: [],
    desc: 'Loom sám navrhne refaktoring, když najde cyklus mezi moduly.' },
  { id: 'e5', title: 'Sken tajemství při každém PR', sys: SYS.sentinel, tasks: [],
    desc: 'Spustit sentinel sken jako povinnou CI bránu, ne jen nightly.' },
  { id: 'e6', title: 'JWT refresh bez výpadku', sys: SYS.forge,
    desc: 'Dokončeno a nasazeno — refresh token rotace bez re-loginu.',
    tasks: [
      { id: 't12', name: 'Návrh rotace',    agent: 'spec-skeleton', glyph: 'doc',    status: 'done', pr: 118 },
      { id: 't13', name: 'Implementace',    agent: 'ci-doctor',     glyph: 'shield', status: 'done', pr: 121 },
      { id: 't14', name: 'Migrace klientů', agent: 'pr-prereview',  glyph: 'check',  status: 'done', pr: 124 },
    ] },
];

const COLS = [
  { key: 'todo',        label: 'To Do' },
  { key: 'in_progress', label: 'In Progress' },
  { key: 'done',        label: 'Done' },
];

const epicProgress = (epic) => {
  const total = epic.tasks.length;
  const done = epic.tasks.filter(t => t.status === 'done').length;
  return { total, done };
};
const epicStatus = (epic) => {
  const { total, done } = epicProgress(epic);
  if (!total) return 'idea';
  if (done === total) return 'done';
  if (epic.tasks.some(t => t.blocked)) return 'blocked';
  if (done > 0 || epic.tasks.some(t => t.status === 'in_progress')) return 'active';
  return 'todo';
};
const EPIC_META = {
  idea:    { c: Z.inkFaint, label: 'Nápad' },
  todo:    { c: Z.inkFaint, label: 'Ve frontě' },
  active:  { c: Z.run,      label: 'Probíhá' },
  blocked: { c: Z.bad,      label: 'Blokováno' },
  done:    { c: Z.ok,       label: 'Hotovo' },
};

const SysTag = ({ sys }) => (
  <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontFamily: Z.mono, fontSize: 10.5, fontWeight: 600, color: sys.hue }}>
    <Icon name={sys.glyph} size={12} /> {sys.name}
  </span>
);

const StatusPill = ({ status }) => {
  const s = EPIC_META[status];
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontFamily: Z.mono, fontSize: 9.5, fontWeight: 700, letterSpacing: '0.06em', textTransform: 'uppercase', padding: '3px 9px', borderRadius: 2, color: s.c, background: `${s.c}1a`, border: `1px solid ${s.c}55` }}>
      <span style={{ width: 5, height: 5, borderRadius: '50%', background: s.c }} /> {s.label}
    </span>
  );
};

// ── Mini kanban (pravý sloupec) — agreguje tasky napříč všemi epiky ────────
let taskUid = 1000;

const MiniTaskCard = ({ task }) => (
  <div style={{ background: Z.bg0, border: `1px solid ${Z.line}`, borderRadius: 6, padding: '9px 10px', display: 'flex', flexDirection: 'column', gap: 5 }}>
    <div style={{ fontFamily: Z.sans, fontSize: 12, color: Z.ink, lineHeight: 1.3 }}>{task.name}</div>
    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
      <span style={{ width: 5, height: 5, borderRadius: '50%', background: task.epicHue, flex: '0 0 auto' }} />
      <Mono style={{ fontSize: 9.5, color: Z.inkFaint, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{task.epicTitle}</Mono>
    </div>
  </div>
);

const NewTaskDialog = ({ epic, onClose, onCreate }) => {
  const [name, setName] = useState('');
  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 100, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(5,7,10,0.72)', backdropFilter: 'blur(3px)', padding: 24 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: 420, maxWidth: '100%', background: Z.panelHi, border: `1px solid ${Z.lineHi}`, borderRadius: Z.rPanel, boxShadow: `0 0 0 1px ${Z.work}22, 0 30px 80px rgba(0,0,0,0.6)`, overflow: 'hidden' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '16px 18px', borderBottom: `1px solid ${Z.line}` }}>
          <Icon name="plus" size={16} style={{ color: Z.work }} />
          <div style={{ fontFamily: Z.sans, fontSize: 14.5, fontWeight: 600, color: Z.ink }}>Nový task</div>
          <button onClick={onClose} style={{ marginLeft: 'auto', background: 'transparent', border: 'none', color: Z.inkFaint, cursor: 'pointer', display: 'flex', padding: 4 }}><Icon name="x" size={16} /></button>
        </div>
        <div style={{ padding: 18 }}>
          <label style={{ fontFamily: Z.mono, fontSize: 10, letterSpacing: '0.14em', color: Z.inkFaint, textTransform: 'uppercase' }}>Název tasku</label>
          <input value={name} onChange={(e) => setName(e.target.value)} autoFocus placeholder="Co je potřeba udělat…" style={{
            width: '100%', marginTop: 8, padding: '10px 12px', background: Z.bg0, border: `1px solid ${Z.line}`, borderRadius: Z.rCtl,
            color: Z.ink, fontFamily: Z.sans, fontSize: 13.5, outline: 'none', boxSizing: 'border-box',
          }} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 16, padding: '9px 12px', background: Z.bg0, border: `1px solid ${Z.line}`, borderRadius: Z.rCtl }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: epic.sys.hue }} />
            <Mono style={{ fontSize: 10.5, color: Z.inkDim }}>{epic.title}</Mono>
          </div>
          <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 20 }}>
            <RunBtn accent={Z.work} label="Přidat do To Do" icon="plus" onClick={() => {
              if (!name.trim()) return;
              onCreate({ id: 't' + (taskUid++), name: name.trim(), status: 'todo', epicId: epic.id, epicTitle: epic.title, epicHue: epic.sys.hue });
            }} />
          </div>
        </div>
      </div>
    </div>
  );
};

const MiniKanban = ({ epic, extraTasks, onAddTask }) => {
  const [dialogOpen, setDialogOpen] = useState(false);
  const all = [
    ...epic.tasks.map(t => ({ ...t, epicTitle: epic.title, epicHue: epic.sys.hue })),
    ...extraTasks.filter(t => t.epicId === epic.id),
  ];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: 14, position: 'relative', minWidth: 0 }}>
      {COLS.map(col => {
        const items = all.filter(t => t.status === col.key);
        return (
          <div key={col.key} style={{ background: Z.panel, border: `1px solid ${Z.line}`, borderRadius: Z.rPanel, padding: 14 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
              <Mono style={{ fontSize: 11, letterSpacing: '0.1em', color: Z.inkFaint, textTransform: 'uppercase' }}>{col.label}</Mono>
              <Mono style={{ fontSize: 10, color: Z.inkFaint }}>{items.length}</Mono>
              {col.key === 'todo' && (
                <button onClick={() => setDialogOpen(true)} title="Přidat task" style={{
                  marginLeft: 'auto', display: 'flex', alignItems: 'center', justifyContent: 'center', width: 22, height: 22,
                  background: 'transparent', border: `1px solid ${Z.line}`, borderRadius: 5, color: Z.inkDim, cursor: 'pointer',
                }}>
                  <Icon name="plus" size={13} />
                </button>
              )}
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: 400, overflowY: 'auto' }}>
              {items.length ? items.map(t => <MiniTaskCard key={t.id} task={t} />) : (
                <div style={{ border: `1px dashed ${Z.line}`, borderRadius: 4, padding: '12px 8px', textAlign: 'center' }}>
                  <Mono style={{ fontSize: 10, color: Z.inkFaint }}>prázdno</Mono>
                </div>
              )}
            </div>
          </div>
        );
      })}
      {dialogOpen && <NewTaskDialog epic={epic} onClose={() => setDialogOpen(false)} onCreate={(t) => { onAddTask(t); setDialogOpen(false); }} />}
    </div>
  );
};

// ── Screen 1: Roadmap — vertikální seznam epiků ────────────────────────────
const EpicRow = ({ epic, onOpen, active }) => {
  const st = epicStatus(epic);
  const { total, done } = epicProgress(epic);
  const pct = total ? Math.round((done / total) * 100) : 0;
  return (
    <div onClick={() => onOpen(epic.id)} style={{
      display: 'flex', flexDirection: 'column', gap: 10, padding: '16px 18px', cursor: 'pointer',
      background: active ? Z.panelHi : Z.panel, border: `1px solid ${active ? epic.sys.hue + '66' : Z.line}`, borderRadius: Z.rPanel,
      boxShadow: active ? `0 0 0 1px ${epic.sys.hue}22` : 'none', transition: 'all .14s',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <div style={{ flex: '0 0 auto', width: 30, height: 30, borderRadius: '50%', display: 'grid', placeItems: 'center', color: epic.sys.hue, border: `1.5px solid ${epic.sys.hue}55`, background: `${epic.sys.hue}14` }}>
          <Icon name={epic.sys.glyph} size={15} />
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0, flexWrap: 'wrap' }}>
            <span style={{ fontFamily: Z.sans, fontSize: 15, fontWeight: 600, color: Z.ink, lineHeight: 1.3 }}>{epic.title}</span>
            <SysTag sys={epic.sys} />
          </div>
        </div>
      </div>
      <div style={{ fontFamily: Z.sans, fontSize: 12, color: Z.inkDim, lineHeight: 1.45 }}>{epic.desc}</div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 14, marginTop: 2 }}>
        <div style={{ flex: '1 1 auto', minWidth: 0 }}>
          {total > 0 ? (
            <React.Fragment>
              <Bar pct={pct} color={epic.sys.hue} h={5} />
              <Mono style={{ fontSize: 10, color: Z.inkFaint, display: 'block', marginTop: 6 }}>{done}/{total} tasků</Mono>
            </React.Fragment>
          ) : (
            <Mono style={{ fontSize: 9.5, color: Z.inkFaint, fontStyle: 'italic' }}>nerozfázováno</Mono>
          )}
        </div>
        <div style={{ flex: '0 0 auto' }}><StatusPill status={st} /></div>
      </div>
    </div>
  );
};

const RoadmapScreen = ({ selectedId, onSelect, extraTasks, onAddTask }) => {
  const epic = EPICS.find(e => e.id === selectedId) || EPICS[0];
  return (
  <div style={{ flex: 1, overflowY: 'auto', padding: '28px 32px' }}>
    <div style={{ display: 'flex', gap: 24, alignItems: 'flex-start', minWidth: 0 }}>
      <div style={{ flex: '0 0 33%', minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 20 }}>
          <div>
            <div style={{ fontFamily: Z.sans, fontSize: 22, fontWeight: 600, color: Z.ink }}>Roadmap</div>
            <div style={{ fontFamily: Z.sans, fontSize: 13, color: Z.inkDim, marginTop: 4 }}>Vyber epik a uvidíš jeho tasky vpravo.</div>
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {EPICS.map(e => <EpicRow key={e.id} epic={e} onOpen={onSelect} active={e.id === epic.id} />)}
        </div>
        <div style={{ marginTop: 16 }}><RunBtn accent={Z.work} label="Nový epik" icon="plus" /></div>
      </div>
      <div style={{ flex: '1 1 auto', minWidth: 0 }}>
        <div style={{ marginBottom: 20, height: 42, display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ width: 6, height: 6, borderRadius: '50%', background: epic.sys.hue }} />
          <Mono style={{ fontSize: 11, letterSpacing: '0.14em', color: Z.inkFaint, textTransform: 'uppercase' }}>{epic.title} — task board</Mono>
        </div>
        <MiniKanban epic={epic} extraTasks={extraTasks} onAddTask={onAddTask} />
      </div>
    </div>
  </div>
  );
};

const App = () => {
  const [selectedId, setSelectedId] = useState(EPICS[0].id);
  const [extraTasks, setExtraTasks] = useState([]);
  return (
    <Frame>
      <RoadmapScreen selectedId={selectedId} onSelect={setSelectedId} extraTasks={extraTasks} onAddTask={(t) => setExtraTasks(prev => [...prev, t])} />
    </Frame>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
