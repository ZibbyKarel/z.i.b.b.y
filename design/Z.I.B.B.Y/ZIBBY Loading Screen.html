<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Z.I.B.B.Y — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0c10;
    color: #e6edf3;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    overflow: hidden;
  }

  /* ── Scan-line overlay ── */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.06) 2px,
      rgba(0,0,0,0.06) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* ── Radial bg glow ── */
  .bg-glow {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 60% 60% at 50% 52%, rgba(91,141,239,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── Stage ── */
  .stage {
    position: fixed; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* ── Logo container ── */
  .logo-wrap {
    position: relative;
    width: 220px; height: 220px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 44px;
  }

  /* Outer orbit ring */
  .orbit-ring {
    position: absolute; inset: -22px;
    border-radius: 50%;
    border: 1px solid rgba(91,141,239,0.18);
    animation: orbit-spin 12s linear infinite;
  }
  .orbit-ring::before {
    content: '';
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #5b8def;
    box-shadow: 0 0 12px 4px rgba(91,141,239,0.7);
    top: -3.5px; left: 50%;
    transform: translateX(-50%);
  }
  @keyframes orbit-spin { to { transform: rotate(360deg); } }

  /* Inner glow rings */
  .glow-ring {
    position: absolute; inset: -10px;
    border-radius: 50%;
    border: 1.5px solid rgba(91,141,239,0.3);
    animation: ring-pulse 2.8s ease-in-out infinite;
  }
  .glow-ring-2 {
    position: absolute; inset: -28px;
    border-radius: 50%;
    border: 1px solid rgba(91,141,239,0.12);
    animation: ring-pulse 2.8s ease-in-out 0.7s infinite;
  }
  @keyframes ring-pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50%       { opacity: 1;   transform: scale(1.03); }
  }

  /* Logo image */
  .logo-img {
    width: 220px; height: 220px;
    border-radius: 50%;
    display: block;
    filter: drop-shadow(0 0 28px rgba(91,141,239,0.55)) drop-shadow(0 0 8px rgba(91,141,239,0.4));
    animation: logo-breathe 3s ease-in-out infinite;
  }
  @keyframes logo-breathe {
    0%, 100% { filter: drop-shadow(0 0 28px rgba(91,141,239,0.55)) drop-shadow(0 0 8px rgba(91,141,239,0.4)); }
    50%       { filter: drop-shadow(0 0 44px rgba(91,141,239,0.8)) drop-shadow(0 0 16px rgba(91,141,239,0.6)); }
  }

  /* Pulse ripple on logo */
  .pulse-ripple {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: rgba(91,141,239,0.08);
    animation: ripple 2.8s ease-out infinite;
  }
  .pulse-ripple-2 {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: rgba(91,141,239,0.05);
    animation: ripple 2.8s ease-out 1.4s infinite;
  }
  @keyframes ripple {
    0%   { transform: scale(1);   opacity: 0.8; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  /* ── Circuit traces (SVG lines from logo) ── */
  .circuit-svg {
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: 0.55;
  }

  /* ── Wordmark ── */
  .wordmark {
    letter-spacing: 0.32em;
    font-size: 28px;
    font-weight: 700;
    color: #e6edf3;
    text-align: center;
    margin-bottom: 8px;
  }
  .wordmark span {
    display: inline-block;
    opacity: 0;
    transform: translateY(6px);
    animation: letter-in 0.35s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .wordmark span.dot {
    color: #5b8def;
    letter-spacing: 0;
    animation-delay: inherit;
  }

  /* ── Tagline ── */
  .tagline {
    font-size: 10px;
    letter-spacing: 0.22em;
    color: #5d6b7a;
    text-transform: uppercase;
    margin-bottom: 52px;
    opacity: 0;
    animation: fade-up 0.5s ease forwards 1.6s;
  }

  @keyframes letter-in {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Progress bar ── */
  .progress-wrap {
    width: 260px;
    margin-bottom: 16px;
    opacity: 0;
    animation: fade-up 0.4s ease forwards 1.8s;
  }
  .progress-track {
    height: 2px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: visible;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    background: #5b8def;
    box-shadow: 0 0 10px 2px rgba(91,141,239,0.6);
    width: 0%;
    transition: width 0.12s linear;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    right: -1px; top: -3px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #7eb0ff;
    box-shadow: 0 0 10px 3px rgba(91,141,239,0.9);
  }

  /* Tick marks */
  .progress-ticks {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
  }
  .progress-ticks span {
    width: 1px; height: 4px;
    background: rgba(255,255,255,0.1);
    display: block;
  }

  /* ── Status line ── */
  .status-line {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: #5b8def;
    height: 16px;
    text-align: center;
    opacity: 0;
    animation: fade-up 0.4s ease forwards 2s;
    min-width: 260px;
    overflow: hidden;
    white-space: nowrap;
  }

  /* status text fade */
  .status-line .status-text {
    display: inline-block;
    animation: none;
  }
  .status-line .status-text.fade-out {
    animation: status-fade-out 0.2s ease forwards;
  }
  .status-line .status-text.fade-in {
    animation: status-fade-in 0.2s ease forwards;
  }
  @keyframes status-fade-out {
    to { opacity: 0; transform: translateY(-4px); }
  }
  @keyframes status-fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Corner decorations ── */
  .corner {
    position: fixed;
    width: 40px; height: 40px;
    opacity: 0.25;
  }
  .corner-tl { top: 24px; left: 24px; border-top: 1.5px solid #5b8def; border-left: 1.5px solid #5b8def; }
  .corner-tr { top: 24px; right: 24px; border-top: 1.5px solid #5b8def; border-right: 1.5px solid #5b8def; }
  .corner-bl { bottom: 24px; left: 24px; border-bottom: 1.5px solid #5b8def; border-left: 1.5px solid #5b8def; }
  .corner-br { bottom: 24px; right: 24px; border-bottom: 1.5px solid #5b8def; border-right: 1.5px solid #5b8def; }

  /* ── Version badge (bottom-right) ── */
  .version {
    position: fixed;
    bottom: 32px; right: 32px;
    font-size: 9px;
    letter-spacing: 0.14em;
    color: #3a4a5a;
    opacity: 0;
    animation: fade-up 0.5s ease forwards 2.2s;
  }

  /* ── Done state: fade out ── */
  .stage.done {
    animation: screen-fade-out 0.55s cubic-bezier(0.4,0,1,1) forwards;
  }
  @keyframes screen-fade-out {
    to { opacity: 0; transform: scale(1.02); }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<!-- Corner brackets -->
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<!-- Version -->
<div class="version">v2.4.1 · BUILD 2026.06</div>

<!-- Circuit trace SVG (decorative, behind logo) -->
<svg class="circuit-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-f">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- animated dash offset for each trace -->
    <style>
      .trace { stroke: #5b8def; stroke-width: 1; fill: none; filter: url(#glow-f); opacity: 0.7; }
      .trace-1 { stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw-trace 1.2s ease forwards 0.3s; }
      .trace-2 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw-trace 1.4s ease forwards 0.5s; }
      .trace-3 { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw-trace 1.3s ease forwards 0.4s; }
      .trace-4 { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw-trace 1.5s ease forwards 0.6s; }
      .trace-5 { stroke-dasharray: 130; stroke-dashoffset: 130; animation: draw-trace 1.1s ease forwards 0.7s; }
      .trace-6 { stroke-dasharray: 150; stroke-dashoffset: 150; animation: draw-trace 1.2s ease forwards 0.8s; }
      .trace-7 { stroke-dasharray: 170; stroke-dashoffset: 170; animation: draw-trace 1.3s ease forwards 0.35s; }
      .trace-8 { stroke-dasharray: 190; stroke-dashoffset: 190; animation: draw-trace 1.4s ease forwards 0.55s; }
      @keyframes draw-trace { to { stroke-dashoffset: 0; } }
      .node { fill: #5b8def; opacity: 0; animation: node-appear 0.3s ease forwards; }
      .node-1 { animation-delay: 1.5s; }
      .node-2 { animation-delay: 1.7s; }
      .node-3 { animation-delay: 1.9s; }
      .node-4 { animation-delay: 1.6s; }
      .node-5 { animation-delay: 1.8s; }
      .node-6 { animation-delay: 2.0s; }
      @keyframes node-appear {
        to { opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Traces radiating from center (500,500) -->
  <!-- Left branch -->
  <path class="trace trace-1" d="M 430 500 H 330 V 440 H 250 V 380" />
  <path class="trace trace-2" d="M 430 510 H 310 V 560 H 220 V 620" />

  <!-- Right branch -->
  <path class="trace trace-3" d="M 570 490 H 680 V 430 H 760 V 370" />
  <path class="trace trace-4" d="M 575 515 H 690 V 570 H 790 V 640" />

  <!-- Top branch -->
  <path class="trace trace-5" d="M 495 360 V 290 H 560 V 230" />
  <path class="trace trace-7" d="M 510 358 V 260 H 440 V 200" />

  <!-- Bottom branch -->
  <path class="trace trace-6" d="M 495 645 V 720 H 580 V 780" />
  <path class="trace trace-8" d="M 508 648 V 730 H 420 V 810" />

  <!-- Terminal nodes -->
  <circle class="node node-1" cx="250" cy="380" r="3.5" />
  <circle class="node node-2" cx="220" cy="620" r="3.5" />
  <circle class="node node-3" cx="760" cy="370" r="3.5" />
  <circle class="node node-4" cx="790" cy="640" r="3.5" />
  <circle class="node node-5" cx="560" cy="230" r="3.5" />
  <circle class="node node-6" cx="440" cy="200" r="3.5" />

  <!-- Small cross-connectors for circuit board feel -->
  <line class="trace trace-2" x1="250" y1="380" x2="250" y2="350" stroke-dasharray="30" stroke-dashoffset="30" />
  <line class="trace trace-3" x1="760" y1="370" x2="800" y2="370" stroke-dasharray="40" stroke-dashoffset="40" />
</svg>

<!-- Main stage -->
<div class="stage" id="stage">

  <!-- Logo -->
  <div class="logo-wrap">
    <div class="pulse-ripple"></div>
    <div class="pulse-ripple-2"></div>
    <div class="glow-ring-2"></div>
    <div class="glow-ring"></div>
    <div class="orbit-ring"></div>
    <img class="logo-img" src="uploads/z.i.b.b.y.png" alt="ZIBBY" />
  </div>

  <!-- Wordmark — each character animated in with staggered delay -->
  <div class="wordmark" id="wordmark"></div>

  <!-- Tagline -->
  <div class="tagline">Intelligent Automation Platform</div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="progress-ticks" id="ticks"></div>
  </div>

  <!-- Status -->
  <div class="status-line" id="status">
    <span class="status-text" id="status-text">Initializing core systems...</span>
  </div>

</div>

<script>
  // ── Wordmark character-by-character ──────────────────────────────────────
  const wm = document.getElementById('wordmark');
  const chars = ['Z','.','I','.','B','.','B','.','Y'];
  chars.forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch;
    if (ch === '.') s.classList.add('dot');
    s.style.animationDelay = (0.1 + i * 0.09) + 's';
    wm.appendChild(s);
  });

  // ── Progress bar ─────────────────────────────────────────────────────────
  const fill   = document.getElementById('progress');
  const ticks  = document.getElementById('ticks');
  const TICKS  = 20;
  for (let i = 0; i < TICKS; i++) {
    const t = document.createElement('span');
    ticks.appendChild(t);
  }

  let pct = 0;
  const statusEl  = document.getElementById('status');
  const statusTxt = document.getElementById('status-text');

  const PHASES = [
    { at: 0,   text: 'Initializing core systems...' },
    { at: 12,  text: 'Loading agent registry...' },
    { at: 26,  text: 'Establishing secure channel...' },
    { at: 41,  text: 'Mounting pipeline orchestrator...' },
    { at: 58,  text: 'Syncing knowledge base...' },
    { at: 72,  text: 'Calibrating gate rules...' },
    { at: 85,  text: 'Warming inference endpoints...' },
    { at: 94,  text: 'System ready.' },
  ];

  let phaseIdx = 0;

  function setStatus(text) {
    statusTxt.classList.add('fade-out');
    setTimeout(() => {
      statusTxt.textContent = text;
      statusTxt.classList.remove('fade-out');
      statusTxt.classList.add('fade-in');
      setTimeout(() => statusTxt.classList.remove('fade-in'), 250);
    }, 200);
  }

  // Simulate loading: fast at first, then slows, then finishes
  const schedule = [];
  // Build a timing schedule for realistic loading feel
  let t = 400;
  while (pct < 100) {
    const increment = pct < 40 ? 3 : pct < 70 ? 2 : pct < 90 ? 1 : 2;
    const delay     = pct < 40 ? 60 : pct < 70 ? 90 : pct < 88 ? 130 : 80;
    schedule.push({ pct: Math.min(pct + increment, 100), t });
    t += delay;
    pct += increment;
  }

  schedule.forEach(({ pct: p, t: time }) => {
    setTimeout(() => {
      fill.style.width = p + '%';

      // Trigger phase text change
      const next = PHASES.findIndex(ph => ph.at <= p);
      const matched = PHASES.filter(ph => ph.at <= p).length - 1;
      if (matched > phaseIdx) {
        phaseIdx = matched;
        setStatus(PHASES[phaseIdx].text);
      }
    }, time);
  });

  // Done: fade out screen
  const totalTime = schedule[schedule.length - 1].t + 500;
  setTimeout(() => {
    document.getElementById('stage').classList.add('done');
  }, totalTime);
</script>
</body>
</html>
