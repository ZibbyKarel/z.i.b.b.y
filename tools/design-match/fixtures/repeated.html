<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: monospace;
        background: #10131a;
        color: #cfd8e8;
      }
      /*
       * Isolated section: proves cssPath anchors to <body> instead of
       * overclaiming uniqueness "by construction". `.widget > .tile > .value`
       * is structurally identical in both places below — same tags, same
       * classes, same child counts — and each instance is unique among its
       * own siblings, so no level's :nth-child disambiguation ever fires.
       * The top-level `.widget` is a direct child of <body>; the second
       * `.widget` is nested one level deeper, inside `.host`, so it is NOT a
       * sibling of the first. An unanchored selector for the top-level
       * instance's descendants matches both.
       */
      .widget {
        width: 300px;
        height: 120px;
        padding: 16px;
      }
      .tile {
        width: 260px;
        height: 80px;
        padding: 8px;
      }
      .value {
        display: block;
        width: 240px;
        height: 40px;
      }
      .host {
        display: block;
        width: 340px;
        padding: 32px;
      }
    </style>
  </head>
  <body>
    <div class="widget">
      <div class="tile">
        <span class="value">Alpha</span>
      </div>
    </div>

    <section class="host">
      <div class="widget">
        <div class="tile">
          <span class="value">Beta</span>
        </div>
      </div>
    </section>
  </body>
</html>
