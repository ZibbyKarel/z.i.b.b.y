<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: monospace;
        background: #0b0e13;
        color: #c9d4e8;
      }
      .surface-card {
        width: 400px;
        padding: 24px;
        background: #11151d;
        border-radius: 8px;
      }
      .fields {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .field-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .field-row > label {
        width: 100%;
        font-size: 14px;
      }
      .field-row > input {
        height: 32px;
        background: #0b0e13;
        border: 1px solid #26303f;
      }
    </style>
  </head>
  <body>
    <div class="surface-card" data-region="card">
      <form class="fields">
        <div class="field-row"><label>Jméno</label><input type="text" /></div>
        <div class="field-row"><label>E-mail</label><input type="email" /></div>
        <div class="field-row"><label>Firma</label><input type="text" /></div>
        <div class="field-row"><label>Role</label><input type="text" /></div>
      </form>
    </div>
  </body>
</html>
