# ZIBBY logs — newsyslog rotation template (Phase 8.3).
#
# Install: edit the absolute paths below, then
#   sudo cp ops/zibby.newsyslog.conf /etc/newsyslog.d/zibby.conf
# macOS runs newsyslog hourly (com.apple.newsyslog), so no extra scheduling.
#
# HELD-OPEN FD CAVEAT (Darwin 27): the API is a launchd service that does NOT reopen
# its log on SIGHUP, so rotation renames the file but the live process keeps writing
# to the old inode until its next restart. Flag `N` therefore suppresses the signal
# (sending SIGHUP would do nothing useful and `B` binary-mode is intentionally
# absent). A freshly rotated api.*.log only starts filling again after
#   launchctl kickstart -k gui/$UID/com.zibby.api
# KeepAlive + the size cap below make this acceptable; restart after rotation if you
# need a hard cap. The backup logs are written by a short-lived job, so they rotate
# cleanly with no caveat.
#
# logfilename                                  mode  count  size   when    flags
⟨/Users/you⟩/Library/Logs/zibby/api.out.log    644   8      10240  *       NZ
⟨/Users/you⟩/Library/Logs/zibby/api.err.log    644   8      10240  *       NZ
⟨/Users/you⟩/Library/Logs/zibby/backup.out.log 644   4      *      $W0D0   NZ
⟨/Users/you⟩/Library/Logs/zibby/backup.err.log 644   4      *      $W0D0   NZ
